<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>SPM</title>

  <meta name="theme-color" content="#eef2f8">

  <script>
    // Tema antes de pintar, para que no parpadee al abrir
    try {
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
      }
    } catch (e) {}
  </script>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SPM">

  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="app.js"></script>
</head>

<body data-tab="entreno">

  <div id="splash" aria-hidden="true">
    <div class="splash-rings">
      <div class="splash-ripple splash-ripple-1"></div>
      <div class="splash-ripple splash-ripple-2"></div>
      <div class="splash-ripple splash-ripple-3"></div>
      <img id="splash-logo" src="assets/logo-wordmark.png" alt="">
    </div>
    <div id="splash-club">Club Colonia Rowing</div>
    <div id="splash-tagline">Contador de remadas</div>
  </div>

  <header id="top-bar">
    <img id="brand-logo" src="assets/logo-wordmark.png" alt="Club Colonia Rowing">
    <button id="settings-btn" class="round-btn" type="button" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <main id="app">

    <!-- ENTRENO: tocar en cualquier lugar que no sea un botón = una remada -->
    <section id="view-entreno" class="view" aria-label="Entreno">

      <div class="glass-card hero-card">
        <div id="circle" class="idle">
          <div id="sphere-fx" aria-hidden="true"></div>
          <div class="ripple ripple-1"></div>
          <div class="ripple ripple-2"></div>
          <div class="ripple ripple-3"></div>
          <div id="spm-display" class="idle">CCR</div>
        </div>
        <div id="unit">REMADAS/MIN</div>
        <div id="status" aria-live="polite"></div>
      </div>

      <div class="glass-card stopwatch-card">
        <div id="sw-time">00:00.0</div>
        <div class="sw-controls">
          <button id="sw-left" type="button" class="sw-btn" disabled>VUELTA</button>
          <button id="sw-right" type="button" class="sw-btn sw-go">INICIAR</button>
        </div>
        <div id="sw-last-lap" class="sw-last-lap"></div>
      </div>

      <div class="glass-card chart-card">
        <div class="chart-plot">
          <div class="chart-y-axis">
            <span id="chart-y-max"></span>
            <span id="chart-y-mid"></span>
            <span id="chart-y-min"></span>
          </div>
          <svg id="chart-svg" viewBox="0 0 300 100" preserveAspectRatio="none">
            <line class="chart-gridline" x1="0" y1="50" x2="300" y2="50"></line>
            <g id="chart-area"></g>
            <g id="chart-line"></g>
            <g id="chart-points"></g>
          </svg>
        </div>
        <div class="chart-x-axis">
          <span>-60s</span>
          <span>ahora</span>
        </div>
      </div>

    </section>

    <section id="view-pasadas" class="view" aria-label="Pasadas" hidden>
      <div id="pasadas-root"></div>
    </section>

    <section id="view-historial" class="view" aria-label="Historial" hidden>
      <h1 class="large-title">Historial</h1>
      <div id="historial-root"></div>
    </section>

  </main>

  <nav id="tabbar" aria-label="Secciones">
    <button class="tab" type="button" data-tab="entreno" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M12 2v3"/></svg>
      <span>Entreno</span>
    </button>
    <button class="tab" type="button" data-tab="pasadas" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
      <span>Pasadas</span>
    </button>
    <button class="tab" type="button" data-tab="historial" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      <span>Historial</span>
    </button>
  </nav>

  <div id="start-flash" aria-hidden="true"></div>

  <div id="sheet-layer" hidden>
    <div id="sheet-backdrop"></div>
    <section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <header class="sheet-header">
        <button id="sheet-back" type="button" class="link-btn" hidden>‹ Atrás</button>
        <h2 id="sheet-title"></h2>
        <button id="sheet-done" type="button" class="link-btn strong">Listo</button>
      </header>
      <div id="sheet-body"></div>
    </section>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

</body>
</html>
