<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SPM</title>

  <meta name="theme-color" content="#000000">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SPM">

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <main id="app">

    <div id="circle">
      <div class="ripple ripple-1"></div>
      <div class="ripple ripple-2"></div>
      <div class="ripple ripple-3"></div>
      <div id="spm-display" class="idle">CCR</div>
    </div>

    <div id="unit">REMADAS/MIN</div>

    <div id="status">Esperando medida</div>

    <div id="help">
      <p><strong>Cómo usar:</strong></p>
      <p>• Tocá la pantalla cada remada</p>
      <p>• Ritmo constante = mejor precisión</p>
      <p>• Doble tap para reiniciar</p>
    </div>

  </main>

  <script src="app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

</body>
</html>
